services:
  db-saver:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=8080
      - ADMIN_USER=admin
      - ADMIN_PASSWORD=change_this_secret_password
      - DATA_DIR=/data
      - RCLONE_CONFIG_PATH=/config/rclone.conf
      - TMP_BACKUP_DIR=/data/tmp
      - TZ=Europe/Paris
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/db-saver/data:/data
      - /opt/db-saver/config/rclone.conf:/config/rclone.conf
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
