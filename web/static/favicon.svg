<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="diskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Rounded Gradient Background -->
  <rect width="32" height="32" rx="8" fill="url(#bgGrad)"/>

  <!-- Database Disks -->
  <g filter="url(#glow)" transform="translate(6, 6)">
    <!-- Top Cylinder -->
    <ellipse cx="10" cy="4" rx="8" ry="2.8" fill="url(#diskGrad)"/>
    
    <!-- Middle Cylinder Body -->
    <path d="M2,4 v4 c0,1.54 3.58,2.8 8,2.8 s8,-1.26 8,-2.8 v-4 c0,1.54 -3.58,2.8 -8,2.8 s-8,-1.26 -8,-2.8 Z" fill="#ffffff" opacity="0.95"/>
    
    <!-- Bottom Cylinder Body -->
    <path d="M2,9 v4 c0,1.54 3.58,2.8 8,2.8 s8,-1.26 8,-2.8 v-4 c0,1.54 -3.58,2.8 -8,2.8 s-8,-1.26 -8,-2.8 Z" fill="#ffffff" opacity="0.9"/>
    
    <!-- Security / Shield Badge in Corner -->
    <circle cx="15" cy="15" r="4.5" fill="#10b981"/>
    <path d="M13.2 15 l1.2 1.2 l2.4 -2.4" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
