<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion &bull; db-saver</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div style="text-align: center; margin-bottom: 28px;">
      <div class="brand-icon" style="width: 52px; height: 52px; margin: 0 auto 16px; border-radius: var(--radius-md);">
        <svg width="28" height="28" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4" />
        </svg>
      </div>
      <h1 class="page-title" style="font-size: 1.6rem; margin-bottom: 6px;">db-saver</h1>
      <p class="page-subtitle">Accédez à vos sauvegardes de bases de données</p>
    </div>

    {{if .Error}}
      <div class="toast toast-error" style="margin-bottom: 20px;">
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>{{.Error}}</span>
      </div>
    {{end}}

    <form method="POST" action="/login">
      <div class="form-group">
        <label class="form-label" for="username">Identifiant</label>
        <input class="form-control" type="text" id="username" name="username" value="{{if .Username}}{{.Username}}{{else}}admin{{end}}" required autofocus>
      </div>

      <div class="form-group" style="margin-bottom: 28px;">
        <label class="form-label" for="password">Mot de passe</label>
        <input class="form-control" type="password" id="password" name="password" placeholder="••••••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 1rem;">
        Se connecter
      </button>
    </form>
  </div>
</body>
</html>
