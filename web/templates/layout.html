<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{block "title" .}}db-saver - Sauvegarde automatique de bases de données{{end}}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="/static/js/htmx.min.js"></script>
  <script src="/static/js/sse.js"></script>
</head>
<body hx-ext="sse">

  <!-- Navbar -->
  <header class="navbar">
    <div class="app-container nav-wrapper">
      <a href="/" class="brand">
        <div class="brand-icon">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4" />
          </svg>
        </div>
        <span class="brand-title">db-saver</span>
        <span class="brand-tag">Dokploy</span>
      </a>

      <nav class="nav-links">
        <a href="/" class="nav-link {{if eq .ActiveTab "dashboard"}}active{{end}}">
          <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
          </svg>
          Dashboard
        </a>
        <a href="/containers" class="nav-link {{if eq .ActiveTab "containers"}}active{{end}}">
          <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
          </svg>
          Conteneurs Docker
        </a>
        <a href="/settings" class="nav-link {{if eq .ActiveTab "settings"}}active{{end}}">
          <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          Paramètres & rclone
        </a>
      </nav>

      <div class="nav-status">
        <div class="status-pill" title="Connexion au socket Docker">
          <span class="dot {{if .DockerConnected}}dot-green{{else}}dot-red{{end}}"></span>
          <span>Docker</span>
        </div>

        <div class="status-pill" title="Remotes rclone disponibles">
          <span class="dot {{if gt .RcloneRemotesCount 0}}dot-green{{else}}dot-amber{{end}}"></span>
          <span>{{.RcloneRemotesCount}} Remote(s)</span>
        </div>

        <form action="/logout" method="POST" style="margin: 0;">
          <button type="submit" class="btn btn-secondary btn-sm" title="Se déconnecter">
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
          </button>
        </form>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="main-content">
    <div class="app-container">
      {{block "content" .}}{{end}}
    </div>
  </main>

  <!-- Modal Container for HTMX -->
  <div id="modal-container"></div>

  <!-- Footer -->
  <footer class="footer">
    <div class="app-container">
      db-saver &bull; Sauvegardes automatisées Docker &amp; rclone
    </div>
  </footer>

  <script>
    function closeModal() {
      const container = document.getElementById('modal-container');
      if (container) {
        container.innerHTML = '';
      }
    }
  </script>
</body>
</html>
